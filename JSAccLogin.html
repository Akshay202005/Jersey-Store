<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Jersey Store | Sign In / Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 400px;
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      transition: background 0.3s;
    }

    .tabs button.active {
      background: #ff7700;
      color: #fff;
    }

    form {
      display: none;
      flex-direction: column;
    }

    form.active {
      display: flex;
    }

    input {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .password-toggle {
      margin: -8px 0 10px;
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
      user-select: none;
    }

    button.submit-btn {
      background: #ff7700;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button.submit-btn:hover {
      background: #ff7700;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff7700;
    }

    .message {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }

    .error {
      background-color: #f8d7da;
      color: #842029;
    }

    .success {
      background-color: #d1e7dd;
      color: #0f5132;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">Welcome to the Jersey Store!</div>

    <div class="tabs">
      <button id="loginTab" class="active">Sign In</button>
      <button id="signupTab">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm" class="active">
      <input type="email" placeholder="Email" required>
      <input 
        type="password" 
        id="loginPassword"
        placeholder="Password" 
        pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
        title="Minimum 8 characters, at least one letter, one number, and one special character." 
        required
      >
      <div class="password-toggle" onclick="toggleVisibility('loginPassword')">Show/Hide Password</div>
      <button class="submit-btn" type="submit">Sign In</button>
      <div id="loginMsg" class="message"></div>
    </form>

    <!-- Sign Up Form -->
    <form id="signupForm">
      <input type="text" placeholder="Username" required>
      <input type="email" placeholder="Email" required>
      <input 
        type="password" 
        id="signupPassword"
        placeholder="Password" 
        pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
        title="Minimum 8 characters, at least one letter, one number, and one special character." 
        required
      >
      <input 
        type="password" 
        id="confirmPassword"
        placeholder="Confirm Password" 
        required
      >
      <div class="password-toggle" onclick="toggleVisibility('signupPassword', 'confirmPassword')">Show/Hide Passwords</div>
      <button class="submit-btn" type="submit">Sign Up</button>
      <div id="signupMsg" class="message"></div>
    </form>
  </div>

  <script>
    // Tab switching
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    });

    signupTab.addEventListener('click', () => {
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    // Show/hide password function
    function toggleVisibility(...ids) {
      ids.forEach(id => {
        const field = document.getElementById(id);
        field.type = field.type === "password" ? "text" : "password";
      });
    }

    // Form validation
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pwd = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('signupMsg');

      if (pwd !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.className = "message error";
      } else {
        msg.textContent = "Account created successfully!";
        msg.className = "message success";
        this.reset();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      msg.textContent = "Logged in successfully!";
      msg.className = "message success";
      this.reset();
    });
  </script>

</body>
</html>
